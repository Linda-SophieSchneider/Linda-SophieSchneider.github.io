    - title: "Validation of Simulation-Based Evaluation by Inclusion of Unlabeled Data and Meta-Ablation"
      year: 2026
      authors: "S. Ploner, L.-S. Schneider, N. K. Waheed, Y. Hwang, A. R. Hassan, J. G. Fujimoto, A. Maier"
      published: "MICCAI 2026"
      has_info: true
      abstract: "Investigates how including unlabeled data and meta-ablation studies improves the validation of simulation-based evaluation methods for medical imaging models."
      pdf: "/papers/validation-simulation-based-evaluation-miccai2026.pdf"

    - title: "TCCT: Trajectory-Conditioned Non-Circular Orbits CBCT Reconstruction with Fourier Neural Operator"
      year: 2026
      authors: "C. Ye, L.-S. Schneider, Y. Sun, S. Mei, F. Wu, S. Bayer, P. A. Pérez-Toro, A. Maier, D. Liu, J. Scheuplein"
      published: "MICCAI 2026"
      has_info: true
      abstract: "Proposes a Fourier neural operator conditioned on the acquisition trajectory to reconstruct cone-beam CT images from non-circular source orbits."
      pdf: "/papers/tcct-miccai2026.pdf"

    - title: "An Analysis of Lightweight Models for Document Image Machine Translation"
      year: 2026
      authors: "A. Bose, T. Gorges, L. Hüttner, L.-S. Schneider, M. Seuret, F. Wu, V. Christlein"
      published: "ICDAR 2026"
      has_info: true
      abstract: "Compares lightweight model architectures for translating text embedded in document images, evaluating the trade-off between model size and translation quality."
      pdf: "https://doi.org/10.1007/978-3-032-36033-5_9"

    - title: "Incremental Learning for Classifying Document Types Based on Content and Layout"
      year: 2026
      authors: "S. M. A. Ahad, T. Gorges, L. Hüttner, L.-S. Schneider, F. Wu, M. Seuret, V. Christlein"
      published: "ICDAR 2026 Workshop"
      has_info: true
      abstract: "Studies incremental learning strategies for classifying document types from a combination of textual content and layout features as new document classes are introduced over time."
      pdf: "/papers/incremental-learning-document-types-icdar2026.pdf"

    - title: "CircleID: ICDAR 2026 Competition on Writer Identification and Pen Classification from Hand-Drawn Circles"
      year: 2026
      authors: "T. Gorges, J. van der Loop, L. Hüttner, L.-S. Schneider, F. Wu, M. Seuret, V. Christlein"
      published: "ICDAR 2026 Competition"
      has_info: true
      abstract: "Introduces CircleID, a large-scale ICDAR 2026 competition using a new 46,155-image dataset of hand-drawn circles to benchmark open-set writer identification and cross-writer pen classification across hundreds of participating teams."
      pdf: "https://arxiv.org/abs/2605.07816"

    - title: "Soft Tuy-Completeness for Robust Projection Selection in Cone-Beam CT"
      year: 2026
      authors: "L.-S. Schneider, A. Maier"
      published: "Submitted to Inverse Problems"
      status: submitted
      has_info: true
      abstract: "Proposes a differentiable, graded relaxation of Tuy's completeness condition, together with an Effective Spatial Resolution diagnostic, for projection selection in region-of-interest cone-beam CT, and shows via NP-completeness analysis that a submodular greedy algorithm with proven approximation guarantees nearly matches an exact MILP solution."
      pdf: "https://arxiv.org/abs/2605.24023"

    - title: "Robustness and Stability Analysis of Differentiable Shift-Variant FBP for Cone-Beam CT under Challenging Acquisition Settings"
      year: 2026
      authors: "C. Ye, L.-S. Schneider, Y. Sun, M. Thies, S. Mei, P. A. Pérez-Toro, S. Bayer, A. Maier"
      published: "Machine Learning for Biomedical Imaging (MELBA), 2026"
      has_info: true
      abstract: "Analyzes the robustness of a differentiable shift-variant FBP framework for cone-beam CT, showing it remains stable under irregular and non-planar trajectories, tolerates sparse-view acquisition with far lower computational cost than iterative methods, and is more sensitive to spatial sampling distribution than to trajectory ordering."
      pdf: "https://doi.org/10.59275/j.melba.2026-252c"

    - title: "diffct: Differentiable CT Operators from Circular Orbits to Arbitrary Trajectories"
      year: 2026
      authors: "Y. Sun, L.-S. Schneider, C. Ye, A. Maier"
      published: "Preprints.org, 2026"
      has_info: true
      abstract: "Presents diffct, a CUDA-accelerated, open-source library providing differentiable forward and exact adjoint operators for 2D parallel-beam, 2D fan-beam, and 3D cone-beam CT, extending from a stable circular-orbit release to arbitrary per-view source/detector trajectories."
      pdf: "https://doi.org/10.20944/preprints202605.1446.v1"

    - title: "Differentiable Approximate Truncation Robust CBCT Reconstruction via Known Operator Learning"
      year: 2026
      authors: "C. Ye, L.-S. Schneider, Y. Sun, S. Mei, S. Bayer, P. A. Pérez-Toro, A. Maier"
      published: "Bildverarbeitung für die Medizin 2026 (BVM Workshop), pp. 328-333"
      has_info: true
      abstract: "Proposes a differentiable, end-to-end trainable approximate-truncation-robust (ATRACT) CBCT reconstruction network built via known operator learning that optimizes redundancy weights under limited-angle/truncated geometry, improving SSIM and MSE over Parker-weighted analytical reconstruction."
      pdf: "https://doi.org/10.1007/978-3-658-51100-5_64"

    - title: "Interpretable Framework for Zero-shot 4D Low-dose CT Denoising: Filter2Noise-4D"
      year: 2026
      authors: "Y. Sun, L.-S. Schneider, S. Mei, C. Ye, M. Gu, F. Wagner, S. Bayer, A. Maier"
      published: "Bildverarbeitung für die Medizin 2026 (BVM Workshop), pp. 34-39"
      has_info: true
      abstract: "Presents Filter2Noise-4D, a zero-shot, interpretable content-adaptive bilateral filtering framework with only about 1.8k parameters that exploits spatio-temporal correlations across neighboring slices to denoise 4D low-dose CT without paired training data or per-protocol retraining."
      pdf: "https://doi.org/10.1007/978-3-658-51100-5_7"

    - title: "Filter2Noise: A Framework for Interpretable and Zero-shot Low-dose CT Image Denoising"
      year: 2026
      authors: "Y. Sun, L.-S. Schneider, S. Mei, J. Wang, G. Hu, M. Gu, C. Ye, F. Wagner, L. Song, S. Bayer, A. Maier"
      published: "Journal of Medical Imaging 13(2), 024004"
      has_info: true
      abstract: "Presents Filter2Noise, a self-supervised, interpretable low-dose CT denoising framework built on an attention-guided bilateral filter with a multi-scale loss and Euclidean Local Shuffle training scheme, achieving state-of-the-art zero-shot performance on Mayo Clinic and photon-counting CT data with only about 3.6k parameters."
      pdf: "https://doi.org/10.1117/1.JMI.13.2.024004"

    - title: "Blind Motion Compensation in Single-Scan CBCT via Test-Time Physics-Guided Manifold Optimization"
      year: 2026
      authors: "Y. Sun, L.-S. Schneider, M. Gu, C. Ye, D. Liu, Z. Yang, F. Wu, S. Bayer, A. Maier"
      published: "Submitted to Medical Physics"
      status: submitted
      has_info: true
      abstract: "Proposes a test-time, physics-guided manifold optimization approach to blindly compensate for motion artifacts in single-scan cone-beam CT without requiring external motion sensors or paired training data."

    - title: "Motion-Aware Deformable Attention-Guided Joint Bilateral Filter for Zero-Shot 4D CT Denoising"
      year: 2026
      authors: "Y. Sun, L.-S. Schneider, S. Mei, C. Ye, M. Gu, F. Wagner, S. Bayer, A. Maier"
      published: "Submitted to International Journal of Computer Assisted Radiology and Surgery"
      status: submitted
      has_info: true
      abstract: "Introduces a motion-aware joint bilateral filter guided by deformable attention to denoise 4D CT data in a zero-shot setting while accounting for inter-phase motion."

    - title: "Noise2Flow: Single-Image Conditional Mean Denoising Flows from Weak Anchor Couplings"
      year: 2026
      authors: "Y. Sun, L.-S. Schneider, M. Gu, S. Mei, C. Ye, L. Cai, J. Wang, G. Hu, D. Liu, Z. Yang, S. Wittl, A. Maier, F. Wu, L. Song"
      published: "Submitted to SPIE"
      status: submitted
      has_info: true
      abstract: "Proposes Noise2Flow, a single-image denoising method that learns a conditional mean denoising flow from weak anchor couplings instead of paired clean/noisy training data."

    - title: "An Update to PYRO-NN: A Python Library for Differentiable CT Operators"
      year: 2025
      authors: "L.-S. Schneider, Y. Sun, C. Ye, M. Michen, A. Maier"
      published: "Fully3D 2025"
      has_info: true
      abstract: "Describes an updated PYRO-NN library for differentiable CT reconstruction, adding PyTorch compatibility, native CUDA kernels for parallel/fan/cone-beam projection and back-projection, artifact-simulation tools, arbitrary trajectory modeling, and a high-level API for end-to-end trainable pipelines."
      pdf: "https://arxiv.org/abs/2511.08427"

    - title: "GB-SVFBP: Gaussian-Based Shift-Variant FBP Neural Network"
      year: 2025
      authors: "C. Ye, L.-S. Schneider, Y. Sun, A. Maier"
      published: "Fully3D 2025"
      has_info: true
      abstract: "Introduces a neural network for cone-beam CT reconstruction from non-circular trajectories that replaces the trajectory-dependent filtering component of a differentiable shift-variant FBP model with a trainable 2D Gaussian model, cutting parameters by about 99% and reducing per-trajectory training time to roughly a quarter of the original while preserving reconstruction quality."
      pdf: "https://arxiv.org/abs/2607.11584"

    - title: "Learning Wavelet-Sparse FDK for 3D Cone-Beam CT Reconstruction"
      year: 2025
      authors: "Y. Sun, L.-S. Schneider, C. Ye, M. Gu, S. Mei, S. Bayer, A. Maier"
      published: "Fully3D 2025"
      has_info: true
      abstract: "Introduces an enhanced, interpretable FDK-based neural network for 3D cone-beam CT that uses wavelet transforms to sparsify trainable cosine-weighting and filtering parameters, cutting parameter count by 93.75% while preserving reconstruction quality and the classical FDK's inference cost."
      pdf: "https://arxiv.org/abs/2505.13579"

    - title: "SV-FBP for Non-Circular CBCT via Trajectory Standardization: Learn Once and for All"
      year: 2025
      authors: "C. Ye, L.-S. Schneider, Y. Sun, S. Bayer, A. Maier"
      published: "IEEE Transactions on Nuclear Science"
      has_info: true
      abstract: "Proposes standardizing non-circular cone-beam CT source trajectories so that a single differentiable shift-variant FBP model, trained once, generalizes across trajectory types instead of requiring per-trajectory retraining."
      pdf: "/papers/sv-fbp-trajectory-standardization-tns.pdf"

    - title: "LSTT: Latent Spatio-Temporal Transformer for Non-rigid Motion Compensation in CBCT"
      year: 2025
      authors: "Y. Sun, L.-S. Schneider, A. Schwarz, M. Gu, S. Mei, C. Ye, S. Bayer, A. Maier"
      published: "Int'l Workshop on Reconstruction and Imaging Motion Estimation (RIME), MICCAI 2025, pp. 76-86"
      has_info: true
      abstract: "Introduces LSTT, an end-to-end framework that uses a VQ-VAE to tokenize CBCT projections, a temporal transformer to model motion dynamics, and a differentiable FDK layer to directly correct non-rigid respiratory motion from projection data without external gating hardware."
      pdf: "https://doi.org/10.1007/978-3-032-06103-4_8"

    - title: "Compensating CBCT Motion Artifacts with Any 2D Generative Model"
      year: 2025
      authors: "Y. Sun, L.-S. Schneider, M. Gu, S. Mei, S. Bayer, A. Maier"
      published: "14th Conference on Industrial Computed Tomography (iCT), Wels, Austria"
      has_info: true
      abstract: "Presents a model-agnostic framework that applies 2D generative models slice-by-slice with a through-plane total-variation consistency loss to compensate for motion artifacts caused by mechanical vibration in industrial cone-beam CT."
      pdf: "https://doi.org/10.58286/30726"

    - title: "Differentiable Few-view CT-Reconstruction for Arbitrary CT-Trajectories including Prior Knowledge"
      year: 2025
      authors: "L.-S. Schneider, A. Waldyra, Y. Sun, A. Maier"
      published: "14th Conference on Industrial Computed Tomography (iCT), Wels, Austria"
      has_info: true
      abstract: "Proposes a two-step few-view CT reconstruction pipeline that first uses the Discrete Algebraic Reconstruction Technique to generate a binary structural prior, then integrates that prior into a differentiable known-operator-learning framework via gradient-update cropping and prior-informed initialization to reconstruct from sparse, arbitrary-trajectory projection data."
      pdf: "https://doi.org/10.58286/30724"

    - title: "Optimization of Analytical Reconstruction Algorithms for Arbitrary CBCT Trajectory Using Deep Learning"
      year: 2025
      authors: "Y. Zhou, L.-S. Schneider, A. Maier"
      published: "14th Conference on Industrial Computed Tomography (iCT), Wels, Austria"
      has_info: true
      abstract: "Proposes two deep-learning-enhanced alternatives to iterative reconstruction for arbitrary CBCT trajectories — one optimizing shift-variant filtering before reconstruction and one applying a learned filter afterward — that improve reconstruction quality over iterative methods while reducing computation."
      pdf: "https://doi.org/10.58286/30749"

    - title: "Task-Based Optimization of CT Trajectories Using a Learned Defect Visibility Metric"
      year: 2025
      authors: "L.-S. Schneider, A. Dhingra, A. Maier"
      published: "14th Conference on Industrial Computed Tomography (iCT), Wels, Austria"
      has_info: true
      abstract: "Proposes optimizing CT scan trajectories using a ResNet-18 model trained to predict defect-detection probability from projections of CAD volumes with embedded artificial defects, then greedily selecting projections that balance high Tuy completeness against task-based defect visibility."
      pdf: "https://doi.org/10.58286/30758"

    - title: "Compressibility Analysis for the Differentiable Shift-Variant Filtered Backprojection Model"
      year: 2025
      authors: "C. Ye, L.-S. Schneider, Y. Sun, M. Thies, A. Maier"
      published: "Proc. SPIE Medical Imaging 2025: Physics of Medical Imaging 13405, 134052L, pp. 539-544"
      has_info: true
      abstract: "Applies PCA to the redundancy weights learned by a differentiable shift-variant FBP model for non-circular CBCT trajectories, achieving a 97.25% reduction in trainable parameters without loss of reconstruction accuracy and substantially faster training."
      pdf: "https://doi.org/10.1117/12.3047414"

    - title: "Learned Shift-Variant CBCT Reconstruction Weights for Non-Continuous Trajectories"
      year: 2025
      authors: "C. Ye, L.-S. Schneider, Y. Sun, M. Thies, A. Maier"
      published: "Bildverarbeitung für die Medizin 2025 (BVM Workshop), pp. 292-297"
      has_info: true
      abstract: "Shows that a differentiable shift-variant FBP neural network can learn redundancy weights for non-continuous or randomly ordered cone-beam CT trajectories, indicating that data-driven weight learning depends on spatial sampling rather than strict trajectory ordering."
      pdf: "https://doi.org/10.1007/978-3-658-47422-5_68"

    - title: "DRACO: Differentiable Reconstruction for Arbitrary CBCT Orbits"
      year: 2025
      authors: "C. Ye, L.-S. Schneider, Y. Sun, M. Thies, S. Mei, A. Maier"
      published: "Physics in Medicine & Biology 70(7), 075005"
      has_info: true
      abstract: "DRACO introduces a differentiable reconstruction framework for cone-beam CT (CBCT) that supports arbitrary imaging orbits, enhancing flexibility and accuracy in CT reconstruction."
      pdf: "https://doi.org/10.1088/1361-6560/adbb50"

